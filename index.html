<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/ico" href="./assets/favicon.ico" />
	<title>Life calendar</title>
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Solway:wght@400;500;700&display=swap">
	<link rel="stylesheet" href="./assets/stylesheet.css">
	<script src="./assets/script.js" defer></script>
</head>
<body>
	<main class="wrapper">
		<header class="header">
			<h1>Life Calendar</h1>
			<p class="subtitle">Every square is one week. A whole life of <strong id="lifespan-label"></strong> years fits on a single page.</p>
		</header>
		<section class="stats" id="stats" aria-label="Life statistics"></section>
		<div class="calendar" id="calendar" aria-label="Weeks of life"></div>
		<section class="legend" id="legend" aria-label="Legend"></section>
		<footer class="footer">One row is one year &middot; five rows between labels</footer>
	</main>
</body>
</html>
